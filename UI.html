<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Virtual Phone UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.phone{
    width:340px;
    height:700px;
    background:#000;
    border-radius:40px;
    padding:12px;
    box-shadow:0 0 40px rgba(0,0,0,0.8);
    position:relative;
    overflow:hidden;
}

.screen{
    width:100%;
    height:100%;
    border-radius:30px;
    overflow:hidden;
    position:relative;
    background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop') center/cover;
}

.statusbar{
    width:100%;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-size:14px;
    font-weight:bold;
    backdrop-filter: blur(10px);
}

.date{
    color:white;
    text-align:center;
    margin-top:30px;
    text-shadow:0 2px 10px rgba(0,0,0,0.7);
}

.date h1{
    font-size:60px;
}

.date p{
    font-size:18px;
}

.apps{
    position:absolute;
    bottom:100px;
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    padding:20px;
}

.app{
    display:flex;
    flex-direction:column;
    align-items:center;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

.app:hover{
    transform:scale(1.08);
}

.icon{
    width:58px;
    height:58px;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    margin-bottom:6px;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

.chrome{background:#ffffff;}
.music{background:#ff3b30;}
.gallery{background:#8e44ff;}
.settings{background:#555;}

.dock{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    height:70px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:24px;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.home-indicator{
    position:absolute;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    width:120px;
    height:5px;
    background:white;
    border-radius:20px;
    opacity:0.8;
}

.app-window{
    position:absolute;
    inset:0;
    background:white;
    z-index:20;
    transform:scale(0.2);
    opacity:0;
    border-radius:40px;
    transition:
        transform 0.35s cubic-bezier(.2,.8,.2,1),
        opacity 0.35s;
    pointer-events:none;
}

.app-window.active{
    transform:scale(1);
    opacity:1;
    border-radius:0;
    pointer-events:auto;
}

.app-header{
    height:70px;
    background:#f1f1f1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    font-weight:bold;
}

.close-btn{
    background:#ff3b30;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:12px;
    cursor:pointer;
}

.app-content{
    padding:30px;
    font-size:20px;
}

</style>
</head>
<body>

<div class="phone">
    <div class="screen">

        <div class="statusbar">
            <span id="time">12:00</span>
            <span>📶 🔋</span>
        </div>

        <div class="date">
            <h1 id="clockBig">12:00</h1>
            <p id="dateText">Senin, 11 Mei</p>
        </div>

        <div class="apps">

            <div class="app" onclick="openApp('Chrome')">
                <div class="icon chrome">🌐</div>
                <span>Chrome</span>
            </div>

            <div class="app" onclick="openApp('Music')">
                <div class="icon music">🎵</div>
                <span>Music</span>
            </div>

            <div class="app" onclick="openApp('Gallery')">
                <div class="icon gallery">🖼️</div>
                <span>Gallery</span>
            </div>

            <div class="app" onclick="openApp('Settings')">
                <div class="icon settings">⚙️</div>
                <span>Settings</span>
            </div>

        </div>

        <div class="dock">
            <div class="icon chrome">📞</div>
            <div class="icon music">💬</div>
            <div class="icon gallery">📷</div>
            <div class="icon settings">🎮</div>
        </div>

        <div class="home-indicator"></div>

        <div class="app-window" id="appWindow">
            <div class="app-header">
                <span id="appTitle">App</span>
                <button class="close-btn" onclick="closeApp()">Close</button>
            </div>

            <div class="app-content">
                Ini tampilan aplikasi virtual 📱
            </div>
        </div>

    </div>
</div>

<script>
function updateClock(){
    const now = new Date();

    const time =
        now.toLocaleTimeString('id-ID',{
            hour:'2-digit',
            minute:'2-digit'
        });

    const date =
        now.toLocaleDateString('id-ID',{
            weekday:'long',
            day:'numeric',
            month:'long'
        });

    document.getElementById('time').innerText = time;
    document.getElementById('clockBig').innerText = time;
    document.getElementById('dateText').innerText = date;
}

setInterval(updateClock,1000);
updateClock();

const appWindow = document.getElementById('appWindow');
const appTitle = document.getElementById('appTitle');

function openApp(name){
    appTitle.innerText = name;
    appWindow.classList.add('active');
}

function closeApp(){
    appWindow.classList.remove('active');
}
</script>

</body>
</html>
